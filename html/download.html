<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Opening file…</title>
  <script>
    (function () {
      try {
        var fileUrl = new URLSearchParams(window.location.search).get('file');
        if (!fileUrl) {
          window.location.replace('/');
          return;
        }
        var u = new URL(fileUrl, window.location.origin);
        var ok =
          u.origin === window.location.origin &&
          (u.pathname.toLowerCase().endsWith('.pdf') || u.pathname.indexOf('/paper/') !== -1);
        window.location.replace(ok ? (u.pathname + u.search + u.hash) : '/');
      } catch (e) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>Opening file…</p>
</body>
</html>
