<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        .error-container {
            display: flex;
            flex-direction: column;

            justify-content: center;

            text-align: center;
            padding: 40px 20px;
            background: #fff;

        .error-code {
