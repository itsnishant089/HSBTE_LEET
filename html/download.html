<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
    <title>Downloading Paper | HSBTE PYQ</title>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body {
            background-color: #f4f7f6;
        }
        .download-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .download-container h2 {
            color: #1565c0;
            margin-bottom: 1rem;
        }
        .countdown-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #1565c0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: #1565c0;
            margin: 2rem auto;
            box-shadow: 0 0 15px rgba(21, 101, 192, 0.2);
        }
        .ad-slot {
            margin: 2rem 0;
            min-height: 100px;
            background: #f8f9fa;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
        .btn-download {
            display: inline-block;
            padding: 1rem 3rem;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
            margin-top: 1rem;
        }
        .btn-download.active {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
        }
        .btn-download.active:hover {
            transform: translateY(-3px);
            background: #0d47a1;
            color: white;
        }
        #file-name-display {
            font-weight: 600;
            color: #555;
            word-break: break-all;
            margin-top: 1.5rem;
            font-size: 1rem;
            background: #e3f2fd;
            padding: 10px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body>
    
    <div class="download-container">
        <h2>Your file is getting ready...</h2>
        <p>Please wait while we prepare your secure download.</p>
        
        <!-- Top Ad Slot -->
        <div class="ad-slot ad-container" data-auto-ad="true">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3142279668395491"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <div class="countdown-circle" id="timer">5</div>

        <a href="#" id="download-btn" class="btn-download">
            <i class="fas fa-lock"></i> Please Wait...
        </a>
        
        <br>
        <p id="file-name-display">Loading file info...</p>

        <!-- Bottom Ad Slot -->
        <div class="ad-slot ad-container" data-auto-ad="true">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3142279668395491"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>
    </div>

    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3142279668395491" crossorigin="anonymous"></script>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');

            // Interstitial removed: send users straight to the PDF when ?file= is present
            if (fileUrl) {
                try {
                    const u = new URL(fileUrl, window.location.origin);
                    const sameOrigin = u.origin === window.location.origin;
                    const isPdfOrPaper =
                        u.pathname.toLowerCase().endsWith('.pdf') ||
                        u.pathname.indexOf('/paper/') !== -1;
                    if (sameOrigin && isPdfOrPaper) {
                        window.location.replace(u.pathname + u.search + u.hash);
                        return;
                    }
                } catch (e) { /* fall through to invalid */ }
            }

            const timerEl = document.getElementById('timer');
            const btn = document.getElementById('download-btn');
            const fileNameDisplay = document.getElementById('file-name-display');
            if (timerEl) timerEl.style.display = 'none';
            if (btn) {
                btn.classList.remove('active');
                btn.innerHTML = 'Invalid File Link';
                btn.removeAttribute('href');
            }
            if (fileNameDisplay) fileNameDisplay.style.display = 'none';
        });
    </script>
</body>
</html>
