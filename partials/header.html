<script>
  // Mobile menu functionality
  (function () {
    const toggle = document.querySelector('.mobile-menu-toggle');
    const menu = document.querySelector('.nav-menu');
    const backdrop = document.querySelector('.nav-backdrop');
    const dropItems = document.querySelectorAll('.has-dropdown');

    if (!toggle || !menu) return;

    function openMenu() {
      menu.classList.add('is-open', 'active'); // Added both for compatibility with older CSS
      toggle.classList.add('is-active', 'active');
      if (backdrop) backdrop.classList.add('visible');
      toggle.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
      menu.classList.remove('is-open', 'active');
      toggle.classList.remove('is-active', 'active');
      if (backdrop) backdrop.classList.remove('visible');
      toggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    toggle.onclick = (e) => {
      e.stopPropagation();
      menu.classList.contains('is-open') || menu.classList.contains('active') ? closeMenu() : openMenu();
    };

    if (backdrop) backdrop.onclick = closeMenu;

    // Close on link click
    menu.querySelectorAll('.nav-link:not(.dropdown-toggle)').forEach(link => {
      link.onclick = closeMenu;
    });

    // Mobile accordion dropdowns
    const mobileQuery = window.matchMedia("(max-width: 992px)");
    dropItems.forEach(item => {
      const btn = item.querySelector('.dropdown-toggle');
      if (!btn) return;
      btn.onclick = (e) => {
        if (!mobileQuery.matches) return;
        e.preventDefault();
        e.stopPropagation();
        const wasOpen = item.classList.contains('open') || item.classList.contains('active');
        dropItems.forEach(i => i.classList.remove('open', 'active'));
        if (!wasOpen) item.classList.add('open', 'active');
      };
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.has-dropdown')) {
        dropItems.forEach(i => i.classList.remove('open', 'active'));
      }
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 992) closeMenu();
    });
  })();
</script>
