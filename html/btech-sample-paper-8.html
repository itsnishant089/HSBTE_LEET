                explanation: "Fashion forecasting is the process of predicting future trends in fashion. This involves analyzing various factors like socio-economic shifts, cultural movements, technological advancements, and consumer behavior to anticipate what will be popular in terms of colors, fabrics, styles, and silhouettes."
            },
            {
                question: "What is the primary function of a 'CAD (Computer-Aided Design) software' in fashion design?",
                options: ["A) To control sewing machines.", "B) To manage inventory and sales.", "C) To create digital patterns, designs, and 3D garment visualizations.", "D) To automate fabric cutting."],
                answer: "C) To create digital patterns, designs, and 3D garment visualizations.",
                explanation: "CAD software in fashion design allows designers to create digital patterns, manipulate designs, generate technical flats, and visualize garments in 2D and 3D. It significantly streamlines the design and development process, reducing the need for physical prototypes."
            }
            // Ensure there are a total of 90 questions, distributed as per the syllabus.
            // Fill in the remaining questions for all sections and subjects.
            // Example: To add more questions, copy and paste the above question structure and modify content.
        ];

        // DOM elements
        const quizContent = document.getElementById('quiz-content');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const completeBtn = document.getElementById('complete-btn');
        const resultContainer = document.getElementById('result-container');
        const progressBar = document.getElementById('progress-bar');
        const correctCount = document.getElementById('correct-count');
        const wrongCount = document.getElementById('wrong-count');
        const unansweredCount = document.getElementById('unanswered-count');
        const resultDetails = document.getElementById('result-details');
        const timeRemainingSpan = document.getElementById('time-remaining');
        const totalQuestionsSpan = document.getElementById('total-questions');
        // New DOM elements for attempted/unattempted counts
        const attemptedCountDisplay = document.getElementById('attempted-count-display');
        const unattemptedCountDisplay = document.getElementById('unattempted-count-display');

        // Quiz state
        let currentQuestion = 0;
        const userAnswers = new Array(questions.length).fill(null);
        let timeLimit = 90 * 60; // 90 minutes in seconds (as per brochure)
        let timerInterval;

        // Function to update attempted and unattempted counts
        function updateQuestionCountsDisplay() {
            let attempted = 0;
            let unattempted = 0;
            userAnswers.forEach(answer => {
                if (answer !== null) {
                    attempted++;
                } else {
                    unattempted++;
                }
            });
            attemptedCountDisplay.textContent = attempted;
            unattemptedCountDisplay.textContent = unattempted;
        }

        // Initialize quiz
        function renderQuestion() {
            const q = questions[currentQuestion];

            // Update progress bar
            progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            // Create question HTML
            let optionsHTML = q.options.map((option, index) => `
                <label class="option">
                    <input type="radio" name="question" value="${option}"
                        ${userAnswers[currentQuestion] === option ? 'checked' : ''}>
                    ${option}
                </label>
            `).join('');

            quizContent.innerHTML = `
                <div class="question-container">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">${optionsHTML}</div>
                </div>
            `;

            // Update button states
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = currentQuestion === questions.length - 1;

            updateQuestionCountsDisplay(); // Update counts after rendering
        }

        // Timer function
        function startTimer() {
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLimit / 60);
                const seconds = timeLimit % 60;
                timeRemainingSpan.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLimit <= 0) {
                    clearInterval(timerInterval);
                    showResults(); // Automatically complete quiz when time runs out
                    alert("Time's up! The quiz has been completed automatically.");
                } else {
                    timeLimit--;
                }
            }, 1000);
        }

        // Event listeners
        prevBtn.addEventListener('click', () => {
            saveAnswer();
            currentQuestion--;
            renderQuestion();
        });

        nextBtn.addEventListener('click', () => {
            saveAnswer();
            currentQuestion++;
            renderQuestion();
        });

        completeBtn.addEventListener('click', showResults);

        // Save the user's answer
        function saveAnswer() {
            const selectedOption = document.querySelector('input[name="question"]:checked');
            userAnswers[currentQuestion] = selectedOption ? selectedOption.value : null;
            updateQuestionCountsDisplay(); // Update counts after saving an answer
        }

        // Show quiz results
        function showResults() {
            clearInterval(timerInterval); // Stop the timer

            saveAnswer(); // Save the answer for the current question before showing results

            let correct = 0;
            let wrong = 0;
            let unanswered = 0;
            let detailsHTML = '';

            questions.forEach((q, index) => {
                const userAnswer = userAnswers[index];

                if (!userAnswer) {
                    unanswered++;
                    detailsHTML += `
                        <div class="result-item">
                            <div><strong>Question ${index + 1}:</strong> ${q.question}</div>
                            <div class="wrong-answer">You did not answer this question.</div>
                            <div class="correct-answer">Correct answer: ${q.answer}</div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    `;
                } else if (userAnswer === q.answer) {
                    correct++;
                    // Add this block to display correct questions
                    detailsHTML += `
                        <div class="result-item correct-detail">
                            <div><strong>Question ${index + 1}:</strong> ${q.question}</div>
                            <div class="correct-answer">Your answer: ${userAnswer} (Correct)</div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    `;
                } else {
                    wrong++;
                    detailsHTML += `
                        <div class="result-item">
                            <div><strong>Question ${index + 1}:</strong> ${q.question}</div>
                            <div class="wrong-answer">Your answer: ${userAnswer}</div>
                            <div class="correct-answer">Correct answer: ${q.answer}</div>
                            <div class="explanation">${q.explanation}</div>
                        </div>
                    `;
                }
            });

            // Update result counts
            correctCount.textContent = correct;
            wrongCount.textContent = wrong;
            unansweredCount.textContent = unanswered;

            // Add details to results
            resultDetails.innerHTML = detailsHTML;

            // Show results and hide quiz
            document.getElementById('quiz-content').style.display = 'none';
            document.querySelector('.navigation').style.display = 'none';
            document.getElementById('complete-btn').style.display = 'none';
            document.querySelector('.quiz-header').style.display = 'none'; // Hide the header during results
            resultContainer.style.display = 'block';

            // Scroll to results
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Initial setup
        totalQuestionsSpan.textContent = questions.length;
        renderQuestion();
        startTimer();
        updateQuestionCountsDisplay(); // Initial update of attempted/unattempted counts
          function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const correct = document.getElementById('correct-count').textContent;
            
            doc.setFontSize(18);
            doc.setTextColor(52, 152, 219);
            doc.text("LEET 2025 Mock Test Report", 15, 20);
            
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text(`Final Score: ${correct} / ${questions.length}`, 15, 30);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, 15, 37);
            
            let y = 50;
            questions.forEach((q, i) => {
                if (y > 260) { doc.addPage(); y = 20; }
                
                doc.setFont("helvetica", "bold");
                const splitTitle = doc.splitTextToSize(`Q${i+1}: ${q.question}`, 180);
                doc.text(splitTitle, 15, y);
                y += (splitTitle.length * 7);
                
                doc.setFont("helvetica", "normal");
                doc.text(`Your Answer: ${userAnswers[i] || 'Not Answered'}`, 20, y);
                y += 6;
                doc.setTextColor(46, 204, 113);
                doc.text(`Correct Answer: ${q.answer}`, 20, y);
                doc.setTextColor(0, 0, 0);
                
                y += 12;
            });
            
            doc.save("LEET_mock_sample_paper_9");
        }
    </script>
