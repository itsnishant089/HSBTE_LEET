            {q:"Vitamin C is found in:",o:["Orange","Milk","Rice","Egg"],a:0},

            {q:"Farm equipment is used in:",o:["Agriculture","Mining","Textile","Printing"],a:0},
            {q:"Indian architecture includes:",o:["Temples","Factories","Malls","Dams"],a:0},
            {q:"Garment industry relates to:",o:["Fashion","Civil","Electrical","Mechanical"],a:0},
            {q:"Fashion designing deals with:",o:["Clothes","Food","Roads","Machines"],a:0},
            {q:"Staple length belongs to:",o:["Fiber","Yarn","Fabric","Thread"],a:0},
            {q:"Dam stores:",o:["Water","Sand","Stone","Soil"],a:0}
        ];

        let currentIdx = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 70 * 60;
        let timerId;

        function startTimer() {
            timerId = setInterval(() => {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                if(timeLeft <= 0) { clearInterval(timerId); showResults(); }
                timeLeft--;
            }, 1000);
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progress').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            
            let html = `
                <div class="question-container">
                    <div class="question-number">Question ${currentIdx + 1} of ${questions.length}</div>
                    <div class="question-text">${q.q}</div>
                    <div class="options">
                        ${q.o.map((opt, i) => `
                            <label class="option">
                                <input type="radio" name="leet" value="${i}" ${userAnswers[currentIdx] == i ? 'checked' : ''} onchange="saveAnswer(${i})">
                                ${opt}
                            </label>
                        `).join('')}
                    </div>
                </div>`;
            document.getElementById('quiz-content').innerHTML = html;
            updateCounts();
        }

        function saveAnswer(val) {
            userAnswers[currentIdx] = val;
            updateCounts();
        }

        function updateCounts() {
            const att = userAnswers.filter(a => a !== null).length;
            document.getElementById('att-count').innerText = att;
            document.getElementById('rem-count').innerText = questions.length - att;
        }

        document.getElementById('prev-btn').onclick = () => { if(currentIdx > 0) { currentIdx--; renderQuestion(); } };
        document.getElementById('next-btn').onclick = () => { if(currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); } };
        document.getElementById('complete-btn').onclick = () => { if(confirm("Complete and see results?")) showResults(); };

        function showResults() {
            clearInterval(timerId);
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('nav-btns').style.display = 'none';
            document.getElementById('complete-btn').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let correct = 0, wrong = 0, skipped = 0;
            let detailsHtml = '';

            questions.forEach((q, i) => {
                const ans = userAnswers[i];
                let status = '';
                if(ans === null) { skipped++; status = 'skipped'; }
                else if(ans == q.a) { correct++; status = 'correct'; }
                else { wrong++; status = 'wrong'; }

                detailsHtml += `
                    <div class="result-item ${status == 'correct' ? 'res-correct' : (status == 'wrong' ? 'res-wrong' : '')}">
                        <strong>Q${i+1}: ${q.q}</strong><br>
                        Your Answer: ${ans !== null ? q.o[ans] : '<span style="color:orange">Skipped</span>'}<br>
                        Correct Answer: <span style="color:green">${q.o[q.a]}</span>
                    </div>`;
            });

            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-wrong').innerText = wrong;
            document.getElementById('res-unanswered').innerText = skipped;
            document.getElementById('result-details').innerHTML = detailsHtml;
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("LEET 2025 Mock Test Report", 10, 10);
            let y = 20;
            questions.forEach((q, i) => {
                if(y > 280) { doc.addPage(); y = 20; }
                const line = `Q${i+1}: ${q.q.substring(0, 50)}... Correct: ${q.o[q.a]}`;
                doc.text(line, 10, y);
                y += 10;
            });
            doc.save("LEET_moock_paper_9.pdf");
        }

        window.onload = () => { renderQuestion(); startTimer(); };
    </script>
